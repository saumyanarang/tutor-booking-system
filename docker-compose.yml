services:
  app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tutorbooking
      - SPRING_DATASOURCE_USERNAME=tutorbooking
      - SPRING_DATASOURCE_PASSWORD=tutorbooking
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_LIQUIBASE_ENABLED=true
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      # Set JWT_SECRET in your shell or a .env file for anything beyond local use (32+ characters).
      - JWT_SECRET=${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
      - LOGGING_FILE_NAME=/app/logs/booking-app.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    healthcheck:
      # Actuator listens on its own port (8081, see management.server.port); busybox wget ships with the JRE image.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tutorbooking
      - POSTGRES_USER=tutorbooking
      - POSTGRES_PASSWORD=tutorbooking
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorbooking -d tutorbooking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app-logs:
  postgres-data:
  redis-data:
