spring:
  application:
    name: tutor-booking
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/tutorbooking
    username: tutorbooking
    password: tutorbooking
  data:
    redis:
      host: localhost
      port: 6379
  profiles:
    active: dev
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  liquibase:
    contexts: ${spring.profiles.active}
    database-change-log-table: Z_LIQ_CHANGELOG
    database-change-log-lock-table: Z_LIQ_CHANGELOG_LOCK
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

# Secret used to sign login tokens (HS256, at least 32 bytes). The default below is for local
# development and tests ONLY - set JWT_SECRET to a long random value anywhere else.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}

booking:
  queue:
    batch-size: 50
    poll-interval-ms: 10
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
