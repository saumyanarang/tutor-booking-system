spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/tutorbooking
    username: tutorbooking
    password: tutorbooking
  jpa:
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    root: info
    com.saumyanarang.tutorbooking: info
    org.hibernate.SQL: info
