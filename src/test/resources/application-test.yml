# Test profile. The datasource and Redis host/port are NOT set here: Testcontainers starts a real
# PostgreSQL and a real Redis and injects their addresses (see support/PostgresContainerSupport and
# support/AbstractIntegrationTest). Liquibase builds the schema exactly as it does in production, and
# Hibernate only *validates* that the entities match it - so a mismatch between a migration and an
# entity fails the build instead of surfacing in production.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.testcontainers: INFO
    com.github.dockerjava: WARN
