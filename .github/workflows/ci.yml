name: CI

# Every push and pull request builds the project and runs the whole test suite.
# The integration tests start a real PostgreSQL and a real Redis with Testcontainers; GitHub's hosted
# Ubuntu runners already have Docker, so no extra services need to be configured here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests (unit + Testcontainers)
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore
